[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnosis-markdown"
version = "1.3.0"
description = "Web scraper and crawler that converts websites to clean Markdown with byte-level provenance for LLM/RAG knowledge bases"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "Steffen Hoehne", email = "steffen.hoehne@shcv.it"},
    {name = "Ali Zahid Raja"},
]
keywords = ["markdown", "web-scraping", "crawler", "html-to-markdown", "knowledge-base", "llm", "rag", "warc", "provenance", "scraping"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Documentation",
    "Typing :: Typed",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "httpx>=0.28.1,<0.29",
    "httpcore>=1.0.9,<1.1",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pyyaml>=6.0.0",
    "warcio>=1.1",
]

[project.optional-dependencies]
qmd = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
]
docs = [
    "markitdown>=0.1",
]
test = [
    "pytest>=8.0.0",
    "python-frontmatter>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/SHCV-it/gnosis"
Repository = "https://github.com/SHCV-it/gnosis"
Issues = "https://github.com/SHCV-it/gnosis/issues"
Changelog = "https://github.com/SHCV-it/gnosis/blob/main/CHANGELOG.md"
Documentation = "https://github.com/SHCV-it/gnosis#readme"
Security = "https://github.com/SHCV-it/gnosis/blob/main/SECURITY.md"

[project.scripts]
gnosis = "gnosis.cli.main:main"
gnosis-bench = "gnosis.bench:bench"
gnosis-doc = "gnosis.integrations.documents:main"

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
gnosis = ["config/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["gnosis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
