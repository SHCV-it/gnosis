# ============================================================================
# Gnosis - Default Configuration
# ============================================================================
# This file contains all configuration parameters for the website-to-markdown
# converter. Copy this file to customize settings.

# ============================================================================
# Downloader Settings
# ============================================================================
downloader:
  # Request timeout in seconds
  timeout: 30

  # Number of retry attempts on failure
  retries: 3

  # User-Agent string for HTTP requests
  user_agent: "Gnosis/1.1 (Website to Markdown converter)"

  # Minimum delay between requests in milliseconds (rate limiting)
  rate_limit_ms: 500

  # Whether to respect robots.txt
  respect_robots: true

  # Extra HTTP headers sent with every request.
  # ${ENV_VAR} references are expanded at load time — keep secrets in the
  # environment, never in this file.
  # headers:
  #   X-Custom-Header: "some-value"

  # Authentication. Exactly one scheme; secrets via ${ENV_VAR}.
  #
  # Bearer token:
  # auth:
  #   type: bearer
  #   token: "${MY_API_TOKEN}"
  #
  # HTTP Basic (Confluence Cloud: email + API token):
  # auth:
  #   type: basic
  #   username: "me@example.com"
  #   password: "${CONFLUENCE_PAT}"
  #
  # Arbitrary auth header:
  # auth:
  #   type: header
  #   name: "X-API-Key"
  #   value: "${MY_API_KEY}"

# ============================================================================
# Crawler Settings (for --all mode)
# ============================================================================
crawler:
  # Maximum crawl depth from the starting URL
  max_depth: 10
  
  # Maximum number of pages to download
  max_pages: 500
  
  # Number of concurrent HTTP requests
  concurrent_requests: 5

# ============================================================================
# Converter Settings
# ============================================================================
converter:
  # HTML tags to completely remove from output
  excluded_tags:
    - script
    - style
    - noscript
    - nav
    - footer
    - aside
    - svg
    - canvas
    - iframe
    - button
    - input
    - form
    - select
    - textarea
    - meta
    - link
    - head
    - template
  
  # CSS selectors to find the main content area. Tried in order — the
  # FIRST selector with a substantial match wins, so platform-specific
  # containers come before generic landmarks that may wrap nav chrome.
  content_selectors:
    - .markdown-body        # GitHub / GitLab rendered markdown
    - .ak-renderer-document # Confluence Cloud page body
    - .wiki-content         # Confluence Server/Data Center page body
    - .docs-content
    - .documentation
    - main
    - article
    - '[role="main"]'
    - .prose
    - .content
    - "#content"
    - "#main"
  
  # CSS classes to strip from content — exact class-token match
  strip_classes:
    - sidebar
    - menu
    - toc
    - table-of-contents
    - navigation
    - breadcrumb
    - pagination
    - search
    - header
    - footer

  # Boilerplate words: class tokens are split on '-'/'_' into words and
  # stripped if any word matches. Catches namespaced framework classes like
  # 'bd-sidebar-primary' without false-positives like 'research-content'.
  strip_class_words:
    - sidebar
    - toc
    - breadcrumb
    - breadcrumbs
    - pagination
    - pager
    - sourcelink
    - headerlink
    - prevnext
    - cookie
    - consent
    - newsletter
    - subscribe
    - social
    - share
    - feedback
    - badge

  # Whether to include images as markdown references
  include_images: true
  
  # Whether to convert relative URLs to absolute
  absolute_urls: true

# ============================================================================
# Output Settings
# ============================================================================
output:
  # Default output directory
  directory: "./"

  # Whether to overwrite existing files
  overwrite: false

  # File extension for output files
  extension: ".md"

  # Write a YAML frontmatter block with provenance metadata to every file:
  # title, url, fetched_at (UTC), content_hash (sha256 of body), status_code,
  # language, author, etag/last_modified, generator version.
  frontmatter: true

  # Extra constant frontmatter fields added to every file
  # (values support ${ENV_VAR} expansion). Example:
  # frontmatter_extra:
  #   tags: [documentation]
  #   owner: knowledge-team

# ============================================================================
# QMD Knowledge Base Integration
# ============================================================================
qmd:
  # Whether to enable QMD integration (also enabled via --qmd-index flag)
  enabled: false
  
  # HuggingFace model for generating context descriptions
  # Options: "Qwen/Qwen3-0.6B" (fast, small), "google/gemma-3-1b-it" (larger)
  llm_model: "Qwen/Qwen3-0.6B"
  
  # Device for LLM inference (cpu, cuda, or auto)
  llm_device: "cpu"
  
  # Data type for model weights
  llm_dtype: "float32"
  
  # Prompt template for context generation
  # Use {content} placeholder for the aggregated markdown content
  context_prompt_template: |
    What is this documentation about? Reply with one concise sentence only. Do not repeat the title, do not use markdown, do not use headings.
    
    {content}
  
  # Maximum tokens to generate for context description
  max_tokens: 80
  
  # Temperature for text generation (higher = more creative)
  temperature: 0.3
  
  # Top-k sampling parameter
  top_k: 50
  
  # Top-p (nucleus) sampling parameter
  top_p: 0.95
  
  # Number of markdown files to sample for context generation
  sample_files_limit: 5
  
  # Maximum characters to use from sampled files
  sample_content_max_chars: 10000
